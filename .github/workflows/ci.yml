name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Offline only: the live e2e (tools/e2e-whirlpool.mjs) needs mainnet
      # access and a reeflog binary, so it is run by hand, not in CI.
      - run: node --test 'test/*.test.mjs'
